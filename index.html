for(var t=t0;t<=t1;t+=DAY){var dt=new Date(t),px=(t-t0)/DAY*PX;if(dt.getUTCDate()===1||t===t0)months+='<span style="left:'+px+'px">'+MON[dt.getUTCMonth()]+' '+dt.getUTCFullYear()+'</span>';if(dt.getUTCDay()===1){weeks+='<span style="left:'+px+'px">KW '+kw(t)+'</span>';vlines+='<div class="vline" style="left:'+px+'px"></div>'}}
var inR=now>=t0&&now<=t1,nowPx=(now-t0)/DAY*PX;todayPx=nowPx;
var overlay=vlines+'<div class="baul" style="left:'+x(BAU_START)+'px;width:'+(x(BAU_END)-x(BAU_START)+PX)+'px"></div>'+(inR?'<div class="todayl" style="left:'+nowPx+'px"></div>':'');
h+='<div class="row head"><div class="lab">Aufgabe</div><div class="track" style="width:'+W+'px"><div class="months">'+months+'</div><div class="weeks">'+weeks+'</div>'+(inR?'<span class="marker today" style="left:'+(nowPx+4)+'px">Heute</span>':'')+'<span class="marker bau" style="left:'+(x(BAU_START)+4)+'px">BAU</span></div></div>';
var groups=cfg.categories.map(function(c){return{id:c.id,name:c.name,color:c.color}});
var orphans=all.filter(function(t){return !byId(cfg.categories,t.cat)});
if(orphans.length)groups.push({id:"__none",name:"Ohne Kategorie",color:"#8C8780"});
groups.forEach(function(g){
if(view.hidden[g.id])return;
var list=g.id==="__none"?orphans:all.filter(function(t){return t.cat===g.id});
var vis=list.filter(passes).sort(function(p,q){return d(p.start)-d(q.start)||d(p.end)-d(q.end)});
var closed=view.collapsed.indexOf(g.id)>=0,dn=list.filter(isDone).length;
h+='<div class="row grp'+(closed?" closed":"")+'"><div class="lab" data-grp="'+esc(g.id)+'" role="button" tabindex="0" aria-expanded="'+(!closed)+'"><span class="caret">▼</span><span class="dot" style="background:'+esc(g.color)+'"></span><span class="t">'+esc(g.name)+'</span><span class="n">'+dn+'/'+list.length+'</span></div><div class="track" style="width:'+W+'px">'+overlay;
if(closed)vis.forEach(function(t){var l=x(t.start),w=Math.max(PX,x(t.end)-l+PX);h+='<div class="mini" style="left:'+l+'px;width:'+w+'px;background:'+esc(g.color)+'"></div>'});
h+='</div></div>';
if(closed)return;
if(!vis.length){h+='<div class="row"><div class="lab emptylab"><span class="o">'+(list.length?"Keine Aufgaben für diesen Filter":"Noch keine Aufgaben")+'</span></div><div class="track" style="width:'+W+'px">'+overlay+'</div></div>'}
vis.forEach(function(t){var l=x(t.start),w=Math.max(PX,x(t.end)-l+PX),c=g.color,st=stOf(t),pr=byId(cfg.priorities,t.prio),bk=byId(cfg.buckets,t.bucket);
var dates=fmt(t.start)+(t.start!==t.end?" – "+fmt(t.end):"");
var sub=[dates];if(bk)sub.push(bk.name);if(t.owner)sub.push(t.owner);
var tip=t.title+" | "+dates+" | "+st.name+(pr?" | Priorität "+pr.name:"");
h+='<div class="row"><div class="lab'+(st.done?" done":"")+'" data-id="'+esc(t.id)+'" role="button" tabindex="0" title="'+esc(tip)+'"><span class="t">'+(pr?'<i class="pr" style="--p:'+esc(pr.color)+'" title="Priorität '+esc(pr.name)+'"></i>':'')+esc(t.title)+'</span><span class="o">'+esc(sub.join(" · "))+'</span></div><div class="track" style="width:'+W+'px">'+overlay;
if(t.milestone){h+='<div class="ms'+(st.done?"":" open")+'" style="--c:'+esc(c)+';left:'+(l+PX/2-9)+'px" data-id="'+esc(t.id)+'" title="'+esc(tip)+'"></div><span class="mslab" style="left:'+(l+PX/2+14)+'px">'+esc(t.title)+'</span>'}
else h+='<div class="task s-'+esc(st.style||"light")+'" style="--c:'+esc(c)+';left:'+l+'px;width:'+w+'px" data-id="'+esc(t.id)+'" title="'+esc(tip)+'">'+(w>60?esc(t.title):"")+'</div>';
h+='</div></div>'});
});
h+='</div></div></div><div class="legend">';
cfg.statuses.forEach(function(s){h+='<span><i class="sw s-'+esc(s.style)+'"></i>'+esc(s.name)+'</span>'});
cfg.priorities.forEach(function(p){h+='<span><i class="pr" style="--p:'+esc(p.color)+'"></i>'+esc(p.name)+'</span>'});
h+='<span><i class="sw bau-sw"></i>BAU 2027</span></div>';
h+='<div class="foot"><button class="btn small" data-act="export">Sicherung herunterladen</button><label class="btn small">Sicherung einspielen<input type="file" accept="application/json,.json" data-act="import" hidden></label></div></div>';
var sc=document.getElementById("scroller"),sl=sc?sc.scrollLeft:null;
root.innerHTML=h;
var nsc=document.getElementById("scroller");nsc.scrollLeft=sl!==null?sl:Math.max(0,nowPx-120);
}
root.addEventListener("click",function(e){
var el=e.target.closest("[data-act],[data-cat],[data-grp],[data-id]");if(!el)return;
var a=el.dataset.act;
if(a==="add")return openTask(null);
if(a==="settings")return openSettings();
if(a==="today"){var sc=document.getElementById("scroller");if(sc)sc.scrollTo({left:Math.max(0,todayPx-120),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
if(a==="export")return exportJson();
if(a==="hidedone"||a==="import")return;
if(el.dataset.cat){var c=el.dataset.cat;if(view.hidden[c])delete view.hidden[c];else view.hidden[c]=1;saveView();return render()}
if(el.dataset.grp)return toggleGrp(el.dataset.grp);
if(el.dataset.id)openTask(el.dataset.id)});
root.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var el=e.target.closest("[data-grp],[data-id]");if(!el||el.tagName==="BUTTON")return;e.preventDefault();if(el.dataset.grp)toggleGrp(el.dataset.grp);else openTask(el.dataset.id)});
root.addEventListener("change",function(e){var t=e.target;
if(t.dataset.act==="hidedone"){view.hideDone=t.checked;saveView();return render()}
if(t.dataset.f){view[t.dataset.f]=t.value;saveView();return render()}
if(t.dataset.act==="import"&&t.files&&t.files[0])importJson(t.files[0])});
function toggleGrp(g){var i=view.collapsed.indexOf(g);if(i>=0)view.collapsed.splice(i,1);else view.collapsed.push(g);saveView();render()}

var dlg=document.createElement("dialog");document.body.appendChild(dlg);
function openTask(id){
var cfg=C(),t=id?byId(state.tasks,id):null,isNew=!t;
if(isNew){var s=iso(todayUTC());t={id:"",title:"",cat:(cfg.categories[0]||{}).id||"",status:((cfg.statuses[1]||cfg.statuses[0])||{}).id||"",prio:((cfg.priorities[1]||cfg.priorities[0])||{}).id||"",bucket:((cfg.buckets[0])||{}).id||"",start:s,end:iso(todayUTC()+7*DAY),owner:"",note:""}}
var owners={};state.tasks.forEach(function(x){if(x.owner)owners[x.owner]=1});
var o='<div class="dlg"><h2>'+(isNew?"Neue Aufgabe":"Aufgabe bearbeiten")+'</h2>';
o+='<div class="f"><label for="f-title">Aufgabe</label><input id="f-title" value="'+esc(t.title)+'" maxlength="140"></div>';
o+='<div class="two"><div class="f"><label for="f-cat">Kategorie</label><select id="f-cat">'+opts(cfg.categories,t.cat,byId(cfg.categories,t.cat)?null:"Ohne Kategorie")+'</select></div>';
o+='<div class="f"><label for="f-bucket">Bereich</label><select id="f-bucket">'+opts(cfg.buckets,t.bucket,"Kein Bereich")+'</select></div></div>';
o+='<div class="two"><div class="f"><label for="f-status">Status</label><select id="f-status">'+opts(cfg.statuses,t.status,null)+'</select></div>';
o+='<div class="f"><label for="f-prio">Priorität</label><select id="f-prio">'+opts(cfg.priorities,t.prio,"Keine")+'</select></div></div>';
o+='<div class="two"><div class="f"><label for="f-start">Start</label><input type="date" id="f-start" value="'+esc(t.start)+'"></div><div class="f"><label for="f-end">Ende</label><input type="date" id="f-end" value="'+esc(t.end)+'"></div></div>';
o+='<label class="chk"><input type="checkbox" id="f-ms"'+(t.milestone?" checked":"")+'> Meilenstein (ein fester Termin)</label>';
o+='<div class="f"><label for="f-owner">Verantwortlich</label><input id="f-owner" list="owners" value="'+esc(t.owner)+'" maxlength="60"><datalist id="owners">'+Object.keys(owners).map(function(k){return'<option value="'+esc(k)+'">'}).join("")+'</datalist></div>';
o+='<div class="f"><label for="f-note">Notiz</label><textarea id="f-note" maxlength="1000">'+esc(t.note)+'</textarea></div>';
o+='<div class="err" id="f-err"></div><div class="acts">'+(isNew?'<span></span>':'<button class="btn danger" id="f-del">Aufgabe löschen</button>')+'<div class="r"><button class="btn" id="f-cancel">Abbrechen</button><button class="btn primary" id="f-save">Speichern</button></div></div></div>';
dlg.innerHTML=o;dlg.showModal();
var ms=dlg.querySelector("#f-ms"),st=dlg.querySelector("#f-start"),en=dlg.querySelector("#f-end");
function syncMs(){en.disabled=ms.checked;if(ms.checked)en.value=st.value}
ms.onchange=syncMs;st.onchange=function(){if(ms.checked||en.value<st.value)en.value=st.value};syncMs();
dlg.querySelector("#f-cancel").onclick=function(){dlg.close()};
var del=dlg.querySelector("#f-del");
if(del)del.onclick=function(){if(del.dataset.c){state.tasks=state.tasks.filter(function(x){return x.id!==t.id});dlg.close();commit("Aufgabe gelöscht")}else{del.dataset.c=1;del.textContent="Wirklich löschen?"}};
dlg.querySelector("#f-save").onclick=function(){
var title=dlg.querySelector("#f-title").value.trim(),s=st.value,e=ms.checked?st.value:en.value,err=dlg.querySelector("#f-err");
if(!title){err.textContent="Gib der Aufgabe einen Namen.";return}
if(!s||!e){err.textContent="Start und Ende brauchen ein Datum.";return}
if(e<s){err.textContent="Das Ende liegt vor dem Start.";return}
var n={id:t.id||uid("t"),title:title,cat:dlg.querySelector("#f-cat").value,bucket:dlg.querySelector("#f-bucket").value,status:dlg.querySelector("#f-status").value,prio:dlg.querySelector("#f-prio").value,start:s,end:e,owner:dlg.querySelector("#f-owner").value.trim(),note:dlg.querySelector("#f-note").value.trim()};
if(ms.checked)n.milestone=true;
if(isNew)state.tasks.push(n);else state.tasks=state.tasks.map(function(x){return x.id===t.id?n:x});
dlg.close();commit(isNew?"Aufgabe hinzugefügt":"Gespeichert")};
setTimeout(function(){var f=dlg.querySelector("#f-title");if(f&&isNew)f.focus()},30);
}

var LISTS=[["categories","Kategorien","Gruppen im Zeitplan, z. B. Website oder Onlineshop."],["statuses","Status","Wie weit eine Aufgabe ist. Die Darstellung bestimmt, wie der Balken aussieht."],["priorities","Priorität","Wird als farbiger Punkt vor der Aufgabe angezeigt."],["buckets","Bereich","Abteilung oder Zuständigkeit, z. B. IT oder Marketing."]];
var FIELD={categories:"cat",statuses:"status",priorities:"prio",buckets:"bucket"};
var STYLES=[["outline","Umriss"],["light","Hell"],["striped","Gestreift"],["solid","Voll"]];
function openSettings(tab){
var work=JSON.parse(JSON.stringify(C())),cur=tab||"categories",removed={categories:[],statuses:[],priorities:[],buckets:[]};
function usage(key,id){var f=FIELD[key];return state.tasks.filter(function(t){return t[f]===id}).length}
function draw(){
var o='<div class="dlg wide"><h2>Listen bearbeiten</h2><div class="tabs" role="tablist">';
LISTS.forEach(function(L){o+='<button class="tab" role="tab" data-tab="'+L[0]+'" aria-selected="'+(L[0]===cur)+'">'+L[1]+'</button>'});
var L=LISTS.filter(function(l){return l[0]===cur})[0],list=work[cur];
o+='</div><p class="hint">'+L[2]+'</p><div class="items">';
list.forEach(function(it,i){var u=usage(cur,it.id);
o+='<div class="item" data-i="'+i+'">';
o+='<div class="mv"><button class="ic" data-mv="-1" aria-label="Nach oben"'+(i===0?" disabled":"")+'>↑</button><button class="ic" data-mv="1" aria-label="Nach unten"'+(i===list.length-1?" disabled":"")+'>↓</button></div>';
if(cur==="categories"||cur==="priorities")o+='<input type="color" class="col" data-k="color" value="'+esc(it.color||"#5E5952")+'" aria-label="Farbe">';
o+='<input class="nm" data-k="name" value="'+esc(it.name)+'" maxlength="40" aria-label="Name">';
if(cur==="statuses"){o+='<select class="sty" data-k="style" aria-label="Darstellung">'+STYLES.map(function(s){return'<option value="'+s[0]+'"'+(s[0]===it.style?" selected":"")+'>'+s[1]+'</option>'}).join("")+'</select><label class="dn"><input type="checkbox" data-k="done"'+(it.done?" checked":"")+'> zählt als fertig</label>'}
o+='<span class="use">'+(u?u+" Aufg.":"")+'</span><button class="ic del" data-del aria-label="Entfernen"'+((cur==="statuses"||cur==="categories")&&list.length<=1?" disabled":"")+'>✕</button></div>';
if(it._confirm)o+='<div class="warn">„'+esc(it.name)+'“ wird bei '+u+' Aufgabe'+(u===1?"":"n")+' verwendet. '+(cur==="statuses"?'Diese bekommen den Status „'+esc((list.filter(function(x){return x!==it})[0]||{}).name||"")+'“.':cur==="categories"?'Diese landen unter „Ohne Kategorie“.':'Dort wird das Feld geleert.')+' <button class="btn small" data-delok="'+i+'">Trotzdem entfernen</button></div>';
});
o+='</div><button class="btn small" data-addit>+ Eintrag hinzufügen</button><div class="err" id="s-err"></div><div class="acts"><span></span><div class="r"><button class="btn" data-cancel>Abbrechen</button><button class="btn primary" data-savecfg>Speichern</button></div></div></div>';
dlg.innerHTML=o;
}
function readInputs(){dlg.querySelectorAll(".item").forEach(function(row){var it=work[cur][+row.dataset.i];row.querySelectorAll("[data-k]").forEach(function(inp){var k=inp.dataset.k;it[k]=inp.type==="checkbox"?inp.checked:inp.value})})}
draw();dlg.showModal();
dlg.onclick=function(e){var b=e.target.closest("button");if(!b||b.disabled)return;
if(b.dataset.tab){readInputs();cur=b.dataset.tab;draw();return}
if(b.hasAttribute("data-cancel")){dlg.onclick=null;dlg.close();return}
var row=b.closest(".item");
if(b.dataset.mv&&row){readInputs();var i=+row.dataset.i,j=i+ +b.dataset.mv,l=work[cur];var tmp=l[i];l[i]=l[j];l[j]=tmp;draw();return}
if(b.hasAttribute("data-del")&&row){readInputs();var it=work[cur][+row.dataset.i];if(usage(cur,it.id)&&!it._confirm){it._confirm=true;draw();return}removeItem(+row.dataset.i);return}
if(b.dataset.delok!=null){readInputs();removeItem(+b.dataset.delok);return}
if(b.hasAttribute("data-addit")){readInputs();var n={id:uid(cur.charAt(0)+"_"),name:""};if(cur==="categories")n.color="#6F7D6B";if(cur==="priorities")n.color="#8E9A8A";if(cur==="statuses"){n.style="light";n.done=false}work[cur].push(n);draw();var ins=dlg.querySelectorAll(".item .nm");if(ins.length)ins[ins.length-1].focus();return}
if(b.hasAttribute("data-savecfg")){readInputs();
var bad=null;LISTS.forEach(function(L){work[L[0]].forEach(function(it){it.name=(it.name||"").trim();delete it._confirm;if(!it.name&&!bad)bad=L[1]})});
if(bad){dlg.querySelector("#s-err").textContent="In „"+bad+"“ hat ein Eintrag noch keinen Namen.";return}
LISTS.forEach(function(L){var key=L[0],f=FIELD[key];removed[key].forEach(function(id){state.tasks.forEach(function(t){if(t[f]===id){t[f]=key==="statuses"?((work.statuses[0]||{}).id||""):""}})})});
state.config=work;dlg.onclick=null;dlg.close();commit("Listen gespeichert")}
};
function removeItem(i){var it=work[cur][i];removed[cur].push(it.id);work[cur].splice(i,1);draw()}
dlg.addEventListener("close",function h(){dlg.onclick=null;dlg.removeEventListener("close",h)});
}

function exportJson(){var blob=new Blob([JSON.stringify({config:state.config,tasks:state.tasks},null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="calvera-zeitplan-"+iso(todayUTC())+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function importJson(file){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.tasks)||!o.config)throw 0;
confirmBox("Sicherung einspielen?","Der aktuelle Zeitplan wird vollständig durch die Sicherung ersetzt ("+o.tasks.length+" Aufgaben).","Ersetzen",function(){state.tasks=o.tasks;state.config=o.config;commit("Sicherung eingespielt")})}catch(e){toast("Die Datei ist keine gültige Zeitplan-Sicherung.")}};r.readAsText(file)}
function confirmBox(title,text,ok,fn){dlg.innerHTML='<div class="dlg"><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><div class="acts"><span></span><div class="r"><button class="btn" id="cb-no">Abbrechen</button><button class="btn primary" id="cb-ok">'+esc(ok)+'</button></div></div></div>';dlg.showModal();dlg.querySelector("#cb-no").onclick=function(){dlg.close()};dlg.querySelector("#cb-ok").onclick=function(){dlg.close();fn()}}

function saveLocal(){try{localStorage.setItem("calvera-zeitplan-data",JSON.stringify({config:state.config,tasks:state.tasks}))}catch(e){}}
function commit(msg){
render();
if(mode==="firebase"&&fb){setSaving("Speichert …");
fb.setDoc(fb.ref,{config:state.config,tasks:state.tasks,updated:Date.now()}).then(function(){setSaving(msg)},function(){setSaving("Speichern fehlgeschlagen. Prüf die Internetverbindung und die Firestore-Regeln.")})}
else{saveLocal();setSaving(msg+" (nur in diesem Browser)")}
}
function goLocal(reason){mode="local";try{var l=JSON.parse(localStorage.getItem("calvera-zeitplan-data")||"null");if(l&&Array.isArray(l.tasks)&&l.config){state.tasks=l.tasks;state.config=l.config}}catch(e){}
savingMsg=reason;render()}
render();
if(!FIREBASE_CONFIG){goLocal("Noch keine Datenbank verbunden. Änderungen bleiben nur in diesem Browser.")}
else{var V="https://www.gstatic.com/firebasejs/12.17.1/";
Promise.all([import(V+"firebase-app.js"),import(V+"firebase-firestore.js")]).then(function(m){
var app=m[0].initializeApp(FIREBASE_CONFIG),F=m[1],db=F.getFirestore(app),ref=F.doc(db,FB_COLLECTION,FB_DOC);
fb={ref:ref,setDoc:F.setDoc};var seeded=false;
F.onSnapshot(ref,function(snap){mode="firebase";savingMsg="";
if(!snap.exists()){if(!seeded){seeded=true;F.setDoc(ref,{config:state.config,tasks:state.tasks,updated:Date.now()}).catch(function(){})}return}
var dt=snap.data();if(dt&&Array.isArray(dt.tasks)){state.tasks=dt.tasks;if(dt.config)state.config=dt.config;render()}
},function(){goLocal("Keine Verbindung zur Datenbank. Prüf die Firestore-Regeln. Änderungen bleiben vorerst nur in diesem Browser.")});
}).catch(function(){goLocal("Keine Verbindung zur Datenbank. Änderungen bleiben vorerst nur in diesem Browser.")})}
var lastDay=todayUTC();setInterval(function(){var t=todayUTC();if(t!==lastDay){lastDay=t;render()}},60000);
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(render,150)});
})();
</script></body></html>
